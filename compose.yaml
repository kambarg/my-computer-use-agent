# Local development stack. From the repository root:
#   cp .env.example .env   # then set ANTHROPIC_API_KEY
#   docker compose up --build
#
# Production (Swagger off, localhost bind, required DB password):
#   docker compose -f compose.yaml -f compose.prod.yaml up --build -d
#
# The backend spawns a worker container per session (not a fixed YAML pool).
# Only the backend publishes a host port. Worker 6080/5900 stay on the
# user-defined network; the backend proxies noVNC.

name: computer-use

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - agent
    restart: unless-stopped

  # Built and tagged so the backend can `docker run` copies. Exits immediately.
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        BASE_IMAGE: ${WORKER_BASE_IMAGE:-ghcr.io/anthropics/anthropic-quickstarts:computer-use-demo-latest}
    image: computer-use-worker:local
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: none

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      BLOB_DIR: /app/data/blobs
      PROVISION_WORKERS: "1"
      WORKER_IMAGE: computer-use-worker:local
      WORKER_NETWORK: computer-use_agent
      MAX_WORKERS: ${MAX_WORKERS:-8}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      API_PROVIDER: ${API_PROVIDER:-anthropic}
      ENABLE_DOCS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_completed_successfully
    networks:
      - agent
    restart: unless-stopped

networks:
  agent:
    name: computer-use_agent
    driver: bridge

volumes:
  pgdata:
